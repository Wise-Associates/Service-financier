[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "irrbb-formules"
version = "0.1.0"
description = "Formules du moteur IRRBB : courbes, chocs, ΔEVE, ΔNII, comportemental, sensibilités, approche standardisée, contrôles"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.3", "mypy==2.4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "exemples"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
# N802/N803/N806 : les formules gardent les notations financières (F, K, T, N, X).
ignore = ["N802", "N803", "N806"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "exemples"]
mypy_path = "src"
