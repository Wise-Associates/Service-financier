name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verifier:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev
      # legacy-peer-deps (web/.npmrc) désactive la vérification des pairs : npm ls la refait.
      - run: npm ls --omit=optional
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
