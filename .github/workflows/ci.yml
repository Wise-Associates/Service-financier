name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verifier:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m pytest
      - run: python exemples/demo_banque_fictive.py sortie
        env:
          PYTHONPATH: src
